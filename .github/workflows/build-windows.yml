name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m py_compile remux_gui.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Remux.exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Remux remux_gui.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Remux-Windows
          path: dist/Remux.exe
          if-no-files-found: error
          retention-days: 30
